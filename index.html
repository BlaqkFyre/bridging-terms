<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridging Terms</title>
<meta name="description" content="Look up a word's meaning, history and equivalents in other languages, and save them to lists.">
<meta name="theme-color" content="#f6f7f8" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bridging Terms">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f7f8; --card:#ffffff; --ink:#1d2327; --muted:#56626a; --line:#d3d9dd;
  --teal:#0b7f7b; --teal-ink:#ffffff; --tealbg:#e2f2f1; --amber-bg:#fdf0dc; --amber:#8a5200;
  --wd:#5b3fb0; --wdbg:#eee9fb; --page:var(--bg);
  --danger:#b3261e; --shadow:0 6px 24px rgba(0,0,0,.14);
  --r-pill:18px; --r-btn:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#1e2124; --card:#2a2e32; --ink:#e8eaec; --muted:#a6aeb5; --line:#464c52;
    --teal:#3cbcb4; --teal-ink:#0f1f1f; --tealbg:#21393a; --amber-bg:#3d3220; --amber:#f0c27a;
    --wd:#c3b3ff; --wdbg:#322b45; --page:var(--bg);
    --danger:#ff8a80; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e2124; --card:#2a2e32; --ink:#e8eaec; --muted:#a6aeb5; --line:#464c52;
  --teal:#3cbcb4; --teal-ink:#0f1f1f; --tealbg:#21393a; --amber-bg:#3d3220; --amber:#f0c27a;
  --wd:#c3b3ff; --wdbg:#322b45; --page:var(--bg);
  --danger:#ff8a80; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
/* Bubblegum: bright and playful, still high-contrast text */
:root[data-theme="bubblegum"]{
  --bg:#fff0f7; --card:#ffffff; --ink:#3a1631; --muted:#7b4a6c; --line:#f2bfda;
  --teal:#c2185b; --teal-ink:#ffffff; --tealbg:#ffe0ef; --amber-bg:#fff3c4; --amber:#7a5200;
  --wd:#6a3fc2; --wdbg:#efe6ff; --page:linear-gradient(165deg,#ffeef7 0%,#fdf2ff 45%,#eef6ff 100%);
  --danger:#b3261e; --shadow:0 8px 26px rgba(194,24,91,.18); --r-pill:22px; --r-btn:18px;
  color-scheme:light;
}
:root[data-theme="bubblegum"] .brand b{background:linear-gradient(90deg,#e91e63,#8e44ff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="bubblegum"] .gobtn,:root[data-theme="bubblegum"] .btn.primary{background:linear-gradient(135deg,#d81b60,#8e24aa);border-color:transparent}
:root[data-theme="bubblegum"] details.pill[open]{box-shadow:0 4px 16px rgba(194,24,91,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{background:var(--page);background-attachment:fixed;min-height:100vh}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
a{color:var(--teal)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{font-weight:700;font-size:1.2rem;letter-spacing:.2px;margin:0}
.brand b{color:var(--teal)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}

/* search */
form.search{display:flex;gap:8px;margin:8px 0}
.search input{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;font-size:1.05rem}
.search input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--tealbg)}
.gobtn{width:48px;height:48px;border-radius:24px;border:0;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.gobtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip.on{background:var(--tealbg);border-color:var(--teal)}
.chip .x{font-size:1rem;line-height:1;color:var(--muted)}
.chip[disabled]{opacity:.45;cursor:default}
.lbl{font-size:.8rem;color:var(--muted);margin:10px 0 0}

/* equal buttons that wrap */
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-btn);padding:10px 12px;min-height:44px;cursor:pointer;font-size:.95rem;text-align:center}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn small{display:block;color:var(--muted);font-size:.78rem}
.btn.choice{text-align:left}
.btn.choice.on{border:1.5px solid var(--teal);background:var(--tealbg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.seg button{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--tealbg);font-weight:600}

/* pill cards */
details.pill,.pill{border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);margin:10px 0}
details.pill[open]{border:1.5px solid var(--teal)}
.pill>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.pill>summary::-webkit-details-marker{display:none}
.pill>summary .meta{color:var(--muted);font-weight:400;font-size:.88rem;display:flex;align-items:center;gap:6px;flex:none}
.pill>summary .chev{transition:transform .15s;display:inline-block}
details.pill[open]>summary .chev{transform:rotate(180deg)}
.pill .body{padding:0 16px 14px}
.pill.static{padding:12px 16px}
a.pill{display:block;text-decoration:none;color:inherit}
a.pill .row{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:12px 16px}
.sumtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.word-h{font-size:1.7rem;font-weight:700;margin:14px 0 0;word-break:break-word}
.word-h small{font-size:.85rem;color:var(--muted);font-weight:400;margin-left:6px}
.pos{font-weight:700}
ol.defs{margin:4px 0 8px;padding-left:22px}
ol.defs li{margin:2px 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:1px 6px;background:var(--tealbg);color:var(--teal);font-weight:600;vertical-align:middle}
.tag.auto{background:var(--amber-bg);color:var(--amber)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.cmp{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.tag.wd{background:var(--wdbg);color:var(--wd)}
.tag.dm{background:var(--wdbg);color:var(--wd)}
.alt-defs{list-style:disc}

.cards{display:block}
@media (min-width:760px){ .cards{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} }
.term{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.term:first-child{border-top:0;padding-top:2px}
.term .main{flex:1;min-width:0}
.script{font-family:"Noto Serif","SBL Hebrew","Ezra SIL","Gentium Plus","Times New Roman",serif;font-size:1.75rem;line-height:1.3;display:block;word-break:break-word;text-align:left;unicode-bidi:isolate}
.say{font-size:.95rem}
.say b{letter-spacing:.3px}
.gloss{font-size:.82rem;color:var(--muted)}
.savebtn{border:1px solid var(--teal);color:var(--teal);background:transparent;border-radius:10px;padding:5px 10px;font-size:.82rem;font-weight:600;cursor:pointer;flex:none;min-height:34px}
.savebtn.saved{background:var(--tealbg)}
.note{border-radius:12px;padding:9px 12px;background:var(--amber-bg);color:var(--amber);font-size:.88rem;margin:10px 0}
.info{border-radius:12px;padding:9px 12px;background:var(--tealbg);font-size:.86rem;margin:6px 0}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 4px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--teal);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.credit{font-size:.75rem;color:var(--muted);text-align:center;margin:22px 0 8px}

/* lists */
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .script{font-size:1.35rem}
.rm{border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:10px;padding:4px 10px;font-size:.8rem;cursor:pointer;min-height:32px;flex:none}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:.92rem}

/* compare boxes */
.sentence{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:1.5rem;line-height:1.35;
  margin:12px 0 4px;padding:12px 14px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);direction:ltr;text-align:left;word-break:break-word}
.sentence .gap{color:var(--muted);font-weight:400}
.seg.two{grid-template-columns:1fr 1fr}
.seg.four{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}
.boxes{display:grid;gap:8px;margin:10px 0;direction:ltr}
.boxes.simple.n2{grid-template-columns:repeat(2,1fr)} .boxes.simple.n3{grid-template-columns:repeat(3,1fr)} .boxes.simple.n4{grid-template-columns:repeat(4,1fr)}
.boxes.details{grid-template-columns:1fr 1fr}
@media (min-width:700px){ .boxes.details.n3{grid-template-columns:repeat(3,1fr)} .boxes.details.n4{grid-template-columns:repeat(4,1fr)} }
.box{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:.88rem;cursor:pointer;width:100%;min-width:0}
.boxes.details .box{min-height:132px}
.boxes.simple .box{min-height:84px;padding:8px;align-items:center;justify-content:center;text-align:center}
.boxes.simple .box .dword{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:1.15rem;word-break:break-word}
.box.lock{border:1.5px solid var(--teal);cursor:default}
.box.act{border:1.5px dashed var(--teal);cursor:default}
.box .bh{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted);width:100%}
.boxes.simple .box .bh{justify-content:space-between;gap:4px}
.box .script{font-size:1.5rem}
.typein{border:1.5px dashed var(--teal);border-radius:var(--r-pill);padding:10px 12px;background:var(--card);margin:8px 0}
.typein .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.typein input,.typein select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 10px;min-height:44px}
.unlock{border:0;background:transparent;cursor:pointer;color:var(--teal);font-size:.8rem;padding:4px;display:inline-flex;align-items:center;gap:3px}
.boxrm{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;cursor:pointer;font-size:.78rem;padding:2px 8px;min-height:28px;display:inline-flex;align-items:center;gap:4px}
.boxrm:hover{border-color:var(--danger);color:var(--danger)}
.lockic{display:inline-flex;color:var(--teal)} .lockic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.dword{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:1.2rem;line-height:1.3;display:block;word-break:break-word}
.boxes.details .dword{font-size:1.35rem}
.boxes.simple .dword{word-break:normal;overflow-wrap:anywhere}
.boxes.simple.n3 .dword{font-size:1.1rem} .boxes.simple.n4 .dword{font-size:clamp(.9rem,3.9vw,1.15rem)}
.orig{font-family:"Noto Serif","SBL Hebrew","Ezra SIL","Gentium Plus","Times New Roman",serif;font-size:1.05rem;unicode-bidi:isolate}
.unlock svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:.75rem}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.tabs a[aria-current="page"]{color:var(--teal);font-weight:600}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  max-height:86vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:none;max-width:760px;margin:0 auto}
.sheet.show,.dim.show{display:block}
.sheet h2{font-size:1.05rem;margin:0 0 8px}
.check{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal);flex:none}
.field{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;margin:6px 0}
select.field{appearance:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
h2.page{font-size:1.45rem;margin:12px 0 2px}
.settings-sec h3{font-size:.95rem;margin:16px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Bridging <b>Terms</b></h1>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Theme: Auto. Tap to change">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none" style="fill:var(--muted)"/></svg>
    </button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="in">
    <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
    <a href="#lists" data-tab="lists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Lists</a>
    <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  </div>
</nav>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const APP_VERSION = '1.3.0';

/* ---------- Languages ---------- */
// code = Wiktionary language code used in translation tables; sec = section heading on Wiktionary entries
const LANGS = [
  {code:'en', name:'English', sec:'English', latin:true},
  {code:'he', name:'Hebrew', sec:'Hebrew', rtl:true, respell:true},
  {code:'hbo', name:'Biblical Hebrew', sec:'Hebrew', rtl:true, respell:true, codes:['hbo'], viaHebrew:true},
  {code:'el', name:'Greek', sec:'Greek', respell:true},
  {code:'grc', name:'Ancient / Koine Greek', sec:'Ancient Greek', respell:true},
  {code:'la', name:'Latin', sec:'Latin', latin:true},
  {code:'arc', name:'Aramaic', sec:'Aramaic', rtl:true, respell:true, codes:['arc','tmr','jpa','syc']},
  {code:'es', name:'Spanish', sec:'Spanish', latin:true},
  {code:'fr', name:'French', sec:'French', latin:true},
  {code:'de', name:'German', sec:'German', latin:true},
  {code:'it', name:'Italian', sec:'Italian', latin:true},
  {code:'pt', name:'Portuguese', sec:'Portuguese', latin:true},
  {code:'ar', name:'Arabic', sec:'Arabic', rtl:true, respell:true},
  {code:'cmn', name:'Chinese (Mandarin)', sec:'Chinese'},
  {code:'ja', name:'Japanese', sec:'Japanese'},
  {code:'ko', name:'Korean', sec:'Korean'},
  {code:'ru', name:'Russian', sec:'Russian', respell:true},
  {code:'hi', name:'Hindi', sec:'Hindi', respell:true},
];
const L = Object.fromEntries(LANGS.map(l => [l.code, l]));
const langName = c => (L[c] ? L[c].name : c);
const MAX_COMPARE = 8;

/* ---------- Storage (guarded) ---------- */
const store = {
  get(k, def){ try{ const v = localStorage.getItem('bt.'+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('bt.'+k, JSON.stringify(v)); return true; }catch(e){ toast('Could not save on this device (storage full or blocked)'); return false; } }
};
let settings = Object.assign({theme:'auto', defaultLang:'en', compare:['he','grc','es']}, store.get('settings', {}));
let lists = store.get('lists', []);
// v1.2: combination names use single spaces instead of " / "
lists.forEach(l => (l.combos || []).forEach(c => { if (/\s\/\s/.test(c.name)) c.name = c.name.replace(/\s+\/\s+/g, ' '); }));
let recent = store.get('recent', []);
const saveSettings = () => store.set('settings', settings);
const saveLists = () => store.set('lists', lists);

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = iso => { try{ return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return iso; } };
const dirAttr = code => (L[code] && L[code].rtl) ? ' dir="rtl"' : '';
const langAttr = code => ` lang="${esc(code==='hbo'?'he':code==='cmn'?'zh':code)}"${dirAttr(code)}`;
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
const ICON = {
  lock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  chev:'<span class="chev" aria-hidden="true">▾</span>',
};

/* ---------- Theme ---------- */
const THEMES = ['auto','light','dark','bubblegum'];
function applyTheme(){

/* ---------- Wiktionary data layer ---------- */
const API = 'https://en.wiktionary.org/w/api.php?action=parse&format=json&formatversion=2&origin=*&redirects=1&prop=text&disableeditsection=1&disablelimitreport=1&page=';
const WIKT = t => 'https://en.wiktionary.org/wiki/' + encodeURIComponent(t.replace(/ /g,'_'));
const CACHE_MAX = 300;
const POS = /^(Noun|Proper noun|Verb|Adjective|Adverb|Interjection|Pronoun|Preposition|Conjunction|Particle|Numeral|Determiner|Article|Phrase|Prepositional phrase|Proverb|Idiom|Prefix|Suffix|Contraction|Letter|Symbol|Participle|Root)\b/i;

async function fetchPage(title){
  const r = await fetch(API + encodeURIComponent(title));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.error) return null;           // missing page
  return { title: j.parse.title, doc: new DOMParser().parseFromString(j.parse.text, 'text/html') };
}
function headingInfo(el){

  let h = null;

  else if (/^H[1-6]$/.test(el.tagName)) h = el;
  if (!h) return null;
  return { level: +h.tagName[1], text: h.textContent.replace(/\[edit\]/,'').trim(), id: h.id || (h.querySelector('[id]')||{}).id || '' };

// Return the sibling elements belonging to a language's level-2 section
// Wiktionary sends phones "mobile" HTML where parts of the page are wrapped in <section> elements;
// flatten those so desktop and mobile HTML are read the same way
const flatKids = el => [...el.children].flatMap(c => c.tagName === 'SECTION' ? flatKids(c) : [c]);
function langSection(doc, secName){
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  const kids = flatKids(root);
  let start = -1;
  for (let i=0;i<kids.length;i++){ const h = headingInfo(kids[i]); if (h && h.level===2 && h.text===secName){ start=i; break; } }
  if (start < 0) return null;
  const out = [];
  for (let i=start+1;i<kids.length;i++){ const h = headingInfo(kids[i]); if (h && h.level<=2) break; out.push(kids[i]); }
  return out;
}
function cleanText(el){
  const c = el.cloneNode(true);
  c.querySelectorAll('style,script,sup.reference,.mw-ref,ul,ol,dl,.HQToggle,.nyms-toggle,.maintenance-line,.etytree,.NavFrame,link').forEach(n=>n.remove());
  return c.textContent.replace(/\s+/g,' ').replace(/\s+([,.;:])/g,'$1').trim();
}
function extractMeanings(sec){
  const meanings = []; let pos = null; let collected = false;
  for (const el of sec){
    const h = headingInfo(el);
    if (h){ pos = POS.test(h.text) ? h.text : null; collected = false; continue; }
    if (pos && !collected){
      const ol = el.tagName === 'OL' ? el : null;
      if (ol){
        const defs = [...ol.children].filter(li=>li.tagName==='LI').map(cleanText).filter(Boolean).slice(0,4);
        if (defs.length) meanings.push({pos, defs});

}
function extractEtymology(sec){
  const out = []; let inEty = false;
  for (const el of sec){
    const h = headingInfo(el);
    if (h){ inEty = /^Etymology/.test(h.text); continue; }
    if (inEty && el.tagName === 'P'){ const t = cleanText(el); if (t) out.push(t); }

}
function firstDefLinkTitle(sec){
  let pos = false;
  for (const el of sec){
    const h = headingInfo(el);
    if (h){ pos = POS.test(h.text); continue; }
    if (pos && el.tagName === 'OL'){
      for (const li of el.children){
        const c = li.cloneNode(true); c.querySelectorAll('ul,dl,ol,.ib-content,.qualifier-content,.gloss-content').forEach(n=>n.remove());
        const a = [...c.querySelectorAll('a[href^="/wiki/"]')].find(a => !/:/.test(a.getAttribute('href').slice(6)) && a.title);

// Pull translations for all supported languages out of translation tables
function extractTranslations(nodes){
  const want = new Map(); // tableLang -> appCode
  for (const l of LANGS){ for (const c of (l.codes || [l.code])) if (!want.has(c)) want.set(c, l.code); }
  const out = {};
  const tables = [];
  for (const n of nodes){ if (n.matches && n.matches('table.translations')) tables.push(n); n.querySelectorAll && tables.push(...n.querySelectorAll('table.translations')); }
  for (const t of tables){
    const gloss = t.getAttribute('data-gloss') || '';
    for (const s of t.querySelectorAll('span[lang]')){
      const tl = s.getAttribute('lang'); const app = want.get(tl);
      if (!app || s.closest('.tr')) continue;
      const term = s.textContent.trim(); if (!term) continue;
      const a = s.querySelector('a'); const page = a && a.title ? a.title.replace(/#.*/,'') : term;
      let tr = '', gender = '', qual = '';
      for (let n = s.nextSibling; n; n = n.nextSibling){
        if (n.nodeType === 3){ if (/[,;]/.test(n.textContent)) break; continue; }
        if (n.nodeType !== 1) continue;
        if (n.tagName === 'UL' || n.tagName === 'DL') break;
        if (n.matches('span[lang]') && !n.classList.contains('tr') && !/-Latn$/.test(n.getAttribute('lang'))) break;

        const q = n.querySelector && n.querySelector('.tr'); if (q) tr = tr || q.textContent.trim();

      }
      for (let n = s.previousSibling; n; n = n.previousSibling){
        if (n.nodeType === 3){ if (/[,;:]/.test(n.textContent)) break; continue; }
        if (n.nodeType === 1 && /qualifier|ib-content/.test(n.className)) { qual = n.textContent.replace(/[()]/g,'').trim(); break; }
      }
      const variety = tl !== (L[app].codes||[app])[0] || (app==='arc' && tl!=='arc') ? tl : '';
      (out[app] = out[app] || []);
      if (!out[app].some(x => x.term === term && x.gloss === gloss)) out[app].push({term, page, tr, gender, gloss, qual, variety});
    }
  }

}
const VARIETY = {tmr:'Jewish Babylonian Aramaic', jpa:'Jewish Palestinian Aramaic', syc:'Classical Syriac'};

/* ---------- Display form for list words: capitalised, transliterated if not in Latin script ---------- */
const NON_LATIN = /[^\u0000-ɏḀ-ỿ̀-ͯ‘-‟\s]/;
const isNonLatin = w => NON_LATIN.test(w || '');

const GREEK = {α:'a',β:'b',γ:'g',δ:'d',ε:'e',ζ:'z',η:'e',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'ph',χ:'kh',ψ:'ps',ω:'o'};
const CYR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
// Simple letter-by-letter transliteration for Greek and Cyrillic only (machine-generated)
function autoTranslit(word){
  const w = (word || '').normalize('NFD').toLowerCase();
  if (/[Ͱ-Ͽἀ-῿]/.test(w)){
    let out = ''; const ch = [...w];
    for (let i=0;i<ch.length;i++){

function displayWord(it){
  if (!isNonLatin(it.word)) return {text: cap(it.word), translit:false};
  const tr = (it.tr || it.autoTr || '').split(/\s*[,;\/]\s*/)[0];
  if (tr) return {text: cap(plainLatin(tr)), translit:true, auto: !it.tr};

const dwHTML = (it, cls='dword') => { const d = displayWord(it); return `<span class="${cls}"${d.missing ? langAttr(it.lang) : ''}>${esc(d.text)}</span>`; };
const dwText = it => displayWord(it).text;

// Strip niqqud / harakat / macrons so we hit Wiktionary page titles
function titleForm(word, code){
  let w = word.trim().replace(/\s+/g,' ');
  if (['he','hbo','arc'].includes(code)) w = w.replace(/[\u0591-\u05C7]/g,'');
  if (code === 'ar') w = w.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  if (code === 'la' || code === 'ru') w = w.normalize('NFD').replace(/[\u0304\u0306\u0301]/g,'').normalize('NFC');
  return w;
}

const CACHE_KEY = 'cache2', TERMS_KEY = 'terms2';   // v1.2: old caches dropped (they held broken phone results)
const withTimeout = (p, ms=9000) => Promise.race([p, new Promise((_,rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const WD_LANG = {cmn:'zh', hbo:'he'};

// Second source 1: Datamuse (English definitions from WordNet / Wiktionary)
async function datamuseDefs(word){
  const r = await withTimeout(fetch('https://api.datamuse.com/words?md=d&max=3&sp=' + encodeURIComponent(word)), 8000);
  const j = await r.json();
  const hit = j.find(x => x.word.toLowerCase() === word.toLowerCase() && x.defs);
  if (!hit) return [];
  const POSN = {n:'noun', v:'verb', adj:'adjective', adv:'adverb', u:''};
  return hit.defs.slice(0,4).map(d => { const [p, ...rest] = d.split('\t'); return {pos: POSN[p] ?? p, def: rest.join(' ').trim()}; }).filter(d => d.def);
}
// Second source 2: Wikidata (names, people, places and concepts, with labels in many languages)
async function wikidataLookup(word, code){
  const wl = WD_LANG[code] || code;
  const r = await withTimeout(fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=10&uselang=en&language=${encodeURIComponent(wl)}&search=${encodeURIComponent(word)}`), 8000);
  const j = await r.json();
  const hits = (j.search || []).filter(h => !/disambiguation|Wikimedia/i.test(h.description || ''));
  if (!hits.length) return null;
  const exact = hits.filter(h => (h.label || '').toLowerCase() === word.toLowerCase() || (h.match && (h.match.text||'').toLowerCase() === word.toLowerCase()));
  const pool = exact.length ? exact : hits;
  const isCap = /^\p{Lu}/u.test(word);
  const isName = h => /given name|family name|surname/i.test(h.description || '');
  const pick = isCap ? (pool.find(h => /given name/i.test(h.description||'')) || pool.find(isName) || pool[0])
                     : (pool.find(h => !isName(h)) || pool[0]);
  const wanted = [...new Set(LANGS.map(l => WD_LANG[l.code] || l.code).concat(['grc','zh-hans']))].join('|');
  const e = await withTimeout(fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=labels|descriptions&languages=${wanted}&ids=${pick.id}`), 8000);
  const ent = (await e.json()).entities[pick.id];
  const labels = {};
  for (const l of LANGS){ const k = WD_LANG[l.code] || l.code; const v = (ent.labels[k] || (l.code==='cmn' && ent.labels['zh-hans']) || {}).value; if (v) labels[l.code] = v; }
  return {id: pick.id, label: pick.label, description: (ent.descriptions.en || {}).value || pick.description || '', labels, url: 'https://www.wikidata.org/wiki/' + pick.id};
}

async function lookup(word, code){
  const key = code + '|' + word.trim().toLowerCase();
  const cache = store.get(CACHE_KEY, {});
  if (cache[key]) return Object.assign({cached:true}, cache[key]);
  const lang = L[code];
  const base = titleForm(word, code);
  const capd = base[0].toUpperCase() + base.slice(1);
  const typedCap = /^\p{Lu}/u.test(base);
  const tries = [...new Set(typedCap ? [base, base.toLowerCase(), capd] : [base.toLowerCase(), base, capd])];
  // start the second sources in parallel; they never block or break the main lookup
  const dmP = code === 'en' ? datamuseDefs(base).catch(() => []) : Promise.resolve([]);
  const wdP = wikidataLookup(base, code).catch(() => null);
  let page = null, sec = null, anyPage = null;
  for (const t of tries){
    const pg = await fetchPage(t);
    if (pg){ anyPage = anyPage || pg; const sc = langSection(pg.doc, lang.sec); if (sc){ page = pg; sec = sc; break; } }
  }
  const res = { word, lang:code, title: base, url: '', meanings:[], etymology:[], translations:{}, pivot:null, name:null, alt:[], wd:null, fetched:new Date().toISOString() };
  if (sec){
    res.title = page.title; res.url = WIKT(page.title) + '#' + lang.sec.replace(/ /g,'_');
    res.meanings = extractMeanings(sec); res.etymology = extractEtymology(sec);
    if (code === 'en'){
      const subLink = sec.flatMap(n => [...n.querySelectorAll('a')]).find(a => (a.title||'') === page.title + '/translations');
      res.translations = extractTranslations(sec);
      if (subLink){
        const sub = await fetchPage(page.title + '/translations');
        if (sub){ const t2 = extractTranslations(flatKids(sub.doc.querySelector('.mw-parser-output')||sub.doc.body));
          for (const k in t2){ res.translations[k] = t2[k].concat(res.translations[k]||[]); } }
      }
    } else {
      // Non-English search: use the first English gloss as a pivot for the translation tables
      const pivot = firstDefLinkTitle(sec);
      if (pivot){
        const en = await fetchPage(pivot);
        const enSec = en && langSection(en.doc, 'English');
        if (enSec){
          res.pivot = en.title;
          res.translations = extractTranslations(enSec);
          res.translations.en = [{term: en.title, page: en.title, tr:'', gender:'', gloss:'', qual:'', variety:''}];
        }
      }
    }
    // Names: if we used the lower-case word, also check the capitalised page for a name ("Proper noun")
    if (page.title !== capd && /^[\p{L}'’-]+$/u.test(base)){
      try{
        const np = await fetchPage(capd);
        const ns = np && langSection(np.doc, lang.sec);
        if (ns){
          const nm = extractMeanings(ns).filter(m => /Proper noun/i.test(m.pos));
          if (nm.length) res.name = {title: np.title, meanings: nm, etymology: extractEtymology(ns), url: WIKT(np.title) + '#' + lang.sec.replace(/ /g,'_')};
        }
      }catch(e){}
    }
  }
  // drop Datamuse definitions that repeat Wiktionary's wording (Datamuse partly draws on Wiktionary)
  const norm = t => t.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
  const seenDefs = new Set(res.meanings.concat(res.name ? res.name.meanings : []).flatMap(m => m.defs).map(norm));
  res.alt = (await dmP).filter(a => !seenDefs.has(norm(a.def)));
  res.wd = await wdP;
  // Wikidata fills languages Wiktionary has no translation for
  if (res.wd){
    for (const [c, label] of Object.entries(res.wd.labels)){
      if (c === code) continue;
      if (!(res.translations[c] || []).length) res.translations[c] = [{term: label, page: label, tr:'', gender:'', gloss:'', qual:'', variety:'', src:'wikidata'}];
    }
  }
  if (!sec && !res.alt.length && !res.wd){
    return anyPage ? { word, lang:code, notFound:'lang', title: anyPage.title } : { word, lang:code, notFound:'page' };
  }
  if (!sec) res.noWiktionary = true;
  cache[key] = res;
  const keys = Object.keys(cache);
  if (keys.length > CACHE_MAX) keys.sort((a,b)=>(cache[a].fetched||'').localeCompare(cache[b].fetched||'')).slice(0, keys.length-CACHE_MAX).forEach(k=>delete cache[k]);
  store.set(CACHE_KEY, cache);
  return res;
}

// Look up a translated term's own entry for a transliteration / IPA (and the Tiberian reading for Biblical Hebrew)
async function enrichTerm(code, t){
  const key = code + '|' + t.page;
  const tc = store.get(TERMS_KEY, {});
  if (tc[key]) return tc[key];
  const out = {tr:'', ipa:'', tiberian:''};
  try{
    const p = await fetchPage(t.page);
    const sec = p && langSection(p.doc, L[code].sec);
    if (sec){
      for (const el of sec){
        const hw = el.querySelector && el.querySelector('strong.headword');
        if (hw){ const trEl = el.querySelector('.headword-tr, .tr'); if (trEl) out.tr = trEl.textContent.trim(); break; }
      }
      for (const el of sec){
        if (!el.querySelectorAll) continue;
        for (const li of el.querySelectorAll('li')){
          const ipa = li.querySelector('.IPA'); if (!ipa) continue;
          if (!out.ipa) out.ipa = ipa.textContent.trim();
          if (!out.tiberian && /Tiberian|Biblical/i.test(li.textContent)) out.tiberian = ipa.textContent.trim();
        }
        if (el.matches && el.matches('ul') && out.ipa && (code!=='hbo' || out.tiberian)) break;
      }
    }
  }catch(e){ out.err = true; return out; }
  tc[key] = out;
  const ks = Object.keys(tc); if (ks.length > 600) delete tc[ks[0]];
  store.set(TERMS_KEY, tc);
  return out;
}

/* ---------- Easy-read respelling (machine-generated from the transliteration) ---------- */
function respell(tr, code){
  if (!tr || !L[code] || !L[code].respell) return '';
  const greek = code==='el' || code==='grc';
  const semitic = ['he','hbo','arc','ar'].includes(code);
  return tr.split(/\s*[,;\/]\s*/).map(part => part.split(/[\s\-‐]+/).filter(Boolean).map(w => respellWord(w, greek, semitic)).filter(Boolean).join(' ')).filter(Boolean).join(', ');
}
function respellWord(w, greek, semitic){
  const s = w.normalize('NFD').toLowerCase();

  const V = 'aeiouəy';
  for (let i=0;i<chars.length;i++){
    let {c, m} = chars[i];
    if (/[ʔʕʼʻ'’`ʾʿ]/.test(c)) continue;
    const stress = /[\u0301\u0300\u0342\u0302]/.test(m);
    const long = /\u0304/.test(m);
    const isV = V.includes(c) && !(c==='y' && !greek);
    if (isV){
      const nx = chars[i+1];
      const pair = nx ? c + nx.c : '';
      if (nx && ['ai','ei','oi','au','ou','eu','ae'].includes(pair) && !/[\u0308]/.test(nx.m)){
        units.push({v:pair, stress: stress || /[\u0301\u0300\u0342\u0302]/.test(nx.m), long:false}); i++; continue;
      }
      units.push({v:c, stress, long}); continue;
    }
    // consonants
    let out = c;
    if (/\u030C/.test(m)) out = ({s:'sh', z:'zh', c:'ch', r:'rzh'})[c] || c;            // š ž č
    else if (/\u0323/.test(m)) out = ({h:'kh', s:'s', t:'t', d:'d', z:'z', k:'k'})[c] || c; // ḥ ṣ ṭ ḍ
    else if (/\u0331/.test(m)) out = ({d:'dh', t:'th', k:'kh', b:'v', g:'gh', p:'f'})[c] || c; // ḏ ṯ
    else if (/\u0307/.test(m)) out = ({g:'gh', z:'z'})[c] || c;                             // ġ
    const nx = chars[i+1] && chars[i+1].c;
    if (nx && ['sh','kh','ch','th','ph','ts','tz','zh','dh','gh'].includes(c+nx) && !(V.includes(nx))){
      out = c + nx; i++;
      if (out==='ch' && (semitic || greek)) out = 'kh';
      if (out==='tz') out = 'ts';
    }
    if (c==='x' && (semitic)) out = 'kh';
    if (c==='q') out = 'k';
    if (c==='j' && !greek) out = 'y';
    if (/[a-z]/.test(out[0])) units.push({k:out});
  }
  const vi = units.map((u,i)=>u.v!==undefined?i:-1).filter(i=>i>=0);
  if (!vi.length) return '';
  const syl = vi.map(()=>({on:'', v:null, co:''}));
  vi.forEach((idx, n) => {
    syl[n].v = units[idx];
    const from = n===0 ? 0 : vi[n-1]+1;
    const cons = units.slice(from, idx).map(u=>u.k);
    if (n===0) syl[0].on = cons.join('');
    else if (cons.length >= 2){ syl[n-1].co += cons[0]; syl[n].on = cons.slice(1).join(''); }
    else syl[n].on = cons.join('');
  });
  syl[syl.length-1].co += units.slice(vi[vi.length-1]+1).map(u=>u.k).join('');
  const vmap = (v, closed) => {
    const {v:x, long} = v;
    if (x==='ai'||x==='ae') return 'eye'; if (x==='ei') return 'ay'; if (x==='oi') return 'oy';
    if (x==='au') return 'ow'; if (x==='ou') return 'oo'; if (x==='eu') return 'ev';
    if (x==='a') return long ? 'aa' : 'a';
    if (x==='e') return long ? 'ay' : (closed ? 'e' : 'eh');
    if (x==='i') return long ? 'ee' : (closed ? 'i' : 'ee');
    if (x==='o') return 'oh';
    if (x==='u') return 'oo';
    if (x==='y') return 'ee';
    if (x==='ə') return 'e';
    return x;
  };
  const anyStress = syl.some(s=>s.v.stress) && syl.length > 1;
  return syl.map(s => { let vv = vmap(s.v, !!s.co); if (vv==='a' && !s.co && anyStress && s.v.stress) vv = 'ah';
    const t = s.on + vv + s.co; return anyStress && s.v.stress ? t.toUpperCase() : t; }).join('-');
}

/* ---------- Lists model ---------- */
const sameItem = (a,b) => a.word === b.word && a.lang === b.lang;
function newList(name, type){ const l = {id:uid(), name:name.trim() || 'Untitled list', type, created:new Date().toISOString(), items:[], combos:[]}; if (type==='compare') l.boxes = {n:2, slots:[null,null,null,null], active:0}; lists.push(l); saveLists(); return l; }
const getList = id => lists.find(l => l.id === id);
function listsContaining(item){ return lists.filter(l => l.items.some(i => sameItem(i,item))).map(l=>l.id); }

/* ---------- Sheet ---------- */
let lastFocus = null;
function openSheet(html, mount){
  lastFocus = document.activeElement;
  const sh = $('#sheet'); sh.innerHTML = html; sh.classList.add('show'); $('#dim').classList.add('show');
  if (mount) mount(sh);
  const f = sh.querySelector('input,button,select'); f && f.focus();
}
function closeSheet(){ $('#sheet').classList.remove('show'); $('#dim').classList.remove('show'); $('#sheet').innerHTML=''; lastFocus && lastFocus.focus && lastFocus.focus(); }
$('#dim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('show')) closeSheet(); });

function confirmSheet(title, text, okLabel, onOk){

    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`, sh => {

function promptSheet(title, value, okLabel, onOk){

    const inp = sh.querySelector('#pv'); inp.select();

function newListSheet(onCreated, preset){

  openSheet(`<h2 id="sheetTitle">New list</h2>
    <input class="field" id="nl" placeholder="List name, e.g. Bible words" aria-label="List name">

/* ---------- Save-to-lists sheet ---------- */
function saveSheet(item, onDone){
  const draw = (sh) => {
    const inLists = new Set(listsContaining(item));
    sh.innerHTML = `<h2 id="sheetTitle">Save “<span${langAttr(item.lang)}>${esc(item.word)}</span>” to…</h2>
      <p class="small muted" style="margin:0 0 6px">${esc(langName(item.lang))}${item.tr ? ' · ' + esc(item.tr) : ''}</p>
      ${lists.length ? '' : '<p class="empty">No lists yet — create one below.</p>'}
      ${lists.map(l => `<label class="check"><span>${esc(l.name)} <span class="tag ${l.type==='compare'?'cmp':'plain'}">${l.type==='compare'?'Bridging':'Simple'}</span></span>
        <input type="checkbox" data-id="${l.id}" ${inLists.has(l.id)?'checked':''}></label>`).join('')}
      <button class="btn" data-new style="width:100%;margin-top:8px">+ New list…</button>
      <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`;
    sh.querySelector('[data-x]').onclick = closeSheet;
    sh.querySelector('[data-new]').onclick = () => newListSheet(l => { openSheet('', s2 => draw(s2)); setTimeout(()=>{ const cb = $('#sheet input[data-id="'+l.id+'"]'); if (cb) cb.checked = true; }, 0); });
    sh.querySelector('[data-ok]').onclick = () => {
      let added = 0, removed = 0;
      sh.querySelectorAll('input[data-id]').forEach(cb => {
        const l = getList(cb.dataset.id); const has = l.items.some(i => sameItem(i,item));
        if (cb.checked && !has){ l.items.push(Object.assign({}, item, {id:uid(), saved:new Date().toISOString()})); added++; }
        if (!cb.checked && has){ const it = l.items.find(i=>sameItem(i,item)); removeItem(l, it.id); removed++; }
      });
      saveLists(); closeSheet();
      toast(added || removed ? `Saved${added?` to ${added} list${added>1?'s':''}`:''}${removed?`${added?', ':' — '}removed from ${removed}`:''}` : 'No changes');
      onDone && onDone();
    };
  };
  openSheet('', draw);
}
function removeItem(l, itemId){
  l.items = l.items.filter(i => i.id !== itemId);
  if (l.boxes) l.boxes.slots = l.boxes.slots.map(s => s === itemId ? null : s);
}

/* ---------- Routing ---------- */
function route(){
  const h = location.hash.replace(/^#/,'');
  if (h.startsWith('list/')) return {name:'list', id:h.slice(5)};
  if (h === 'lists' || h === 'settings') return {name:h};
  return {name:'search'};
}
function render(){
  const r = route();
  document.querySelectorAll('nav.tabs a').forEach(a => {
    const on = a.dataset.tab === (r.name==='list' ? 'lists' : r.name);
    on ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current');
  });
  if (r.name === 'search') renderSearch();
  else if (r.name === 'lists') renderLists();
  else if (r.name === 'list') renderList(r.id);
  else renderSettings();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });

/* ---------- Search view ---------- */
let current = null;   // last lookup result
let searching = false;
function renderSearch(){

function renderHome(){
  const r = $('#results'); if (!r) return;
  r.innerHTML = `
    ${recent.length ? `<p class="lbl">Recent searches</p><div class="chips">${recent.map(x => `<button class="chip" type="button" data-w="${esc(x.word)}" data-l="${x.lang}"${langAttr(x.lang)}>${esc(x.word)}</button>`).join('')}</div>` : `<p class="empty">Type a word and press Enter to see its meaning, history and how it's said in the languages you compare.</p>`}
    <p class="credit">Definitions, word history &amp; translations from <a href="https://en.wiktionary.org/" target="_blank" rel="noopener">Wiktionary</a> (CC BY-SA 4.0), with <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a> (CC0) and <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener">Datamuse</a> as second sources. v${APP_VERSION}</p>`;
  r.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { if (b.dataset.l !== settings.defaultLang){ settings.defaultLang = b.dataset.l; saveSettings(); } doSearch(b.dataset.w); });
}
async function doSearch(word){
  const code = settings.defaultLang;
  searching = true;
  const r = $('#results');
  if ($('#q')) $('#q').value = word;
  r.innerHTML = `<div class="loading" role="status"><span class="spin" aria-hidden="true"></span> Looking up “${esc(word)}”…</div>`;
  try{
    const res = await lookup(word, code);
    current = res;
    if (!res.notFound){ recent = [{word, lang:code}, ...recent.filter(x => !(x.word.toLowerCase()===word.toLowerCase() && x.lang===code))].slice(0,12); store.set('recent', recent); }
    searching = false;
    if (route().name === 'search') renderResults(res);
  }catch(err){
    searching = false;
    const off = navigator.onLine === false;
    r.innerHTML = `<div class="note" role="alert">${off ? 'You’re offline — new words need an internet connection. Words you’ve looked up before still open.' : 'Couldn’t reach Wiktionary just now. Check your connection and try again.'}</div>`;
  }
}
function pickDefaultLang(){
  openSheet(`<h2 id="sheetTitle">Default language</h2><p class="small muted" style="margin:0 0 6px">The language of the words you type.</p>
    ${LANGS.filter(l=>l.code!=='hbo').map(l => `<label class="check"><span>${esc(l.name)}</span><input type="radio" name="dl" value="${l.code}" ${l.code===settings.defaultLang?'checked':''}></label>`).join('')}
    <div class="btns"><button class="btn primary" data-ok>Done</button></div>`, sh => {
    sh.querySelector('[data-ok]').onclick = () => { const c = sh.querySelector('input[name=dl]:checked').value; settings.defaultLang = c; saveSettings(); current = null; closeSheet(); render(); };

}
function pickCompareLangs(){
  openSheet(`<h2 id="sheetTitle">Compare languages</h2><p class="small muted" style="margin:0 0 6px">Pick up to ${MAX_COMPARE}.</p>
    <div id="lc">${LANGS.filter(l=>l.code!==settings.defaultLang).map(l => `<label class="check"><span>${esc(l.name)}</span><input type="checkbox" value="${l.code}" ${settings.compare.includes(l.code)?'checked':''}></label>`).join('')}</div>
    <p class="small muted" id="lcn" aria-live="polite"></p>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Done</button></div>`, sh => {
    const boxes = [...sh.querySelectorAll('#lc input')];
    const sync = () => { const n = boxes.filter(b=>b.checked).length; boxes.forEach(b => b.disabled = !b.checked && n >= MAX_COMPARE); sh.querySelector('#lcn').textContent = `${n} of ${MAX_COMPARE} selected`; };
    boxes.forEach(b => b.onchange = sync); sync();
    sh.querySelector('[data-x]').onclick = closeSheet;
    sh.querySelector('[data-ok]').onclick = () => { settings.compare = boxes.filter(b=>b.checked).map(b=>b.value); saveSettings(); closeSheet(); render(); };
  });
}
function renderResults(res){
  const r = $('#results'); if (!r) return;
  if (res.notFound){
    r.innerHTML = res.notFound === 'page'
      ? `<div class="note">No Wiktionary entry found for “${esc(res.word)}”. Check the spelling, or try another form of the word.</div>`
      : `<div class="note">Wiktionary has a page for “${esc(res.word)}”, but no ${esc(langName(res.lang))} entry. Try changing the default language.</div>`;
    return;
  }
  const code = res.lang;
  const alt = res.alt || [];
  const posList = [...new Set(res.meanings.map(m => m.pos.toLowerCase()).concat(res.name ? ['name'] : []).concat(!res.meanings.length ? alt.map(a=>a.pos).filter(Boolean) : []))].join(', ')
    || (res.wd && res.wd.description) || '';
  const first = (res.meanings[0] && res.meanings[0].defs[0]) || (res.name && res.name.meanings[0].defs[0]) || (alt[0] && alt[0].def) || (res.wd && res.wd.description) || '';
  const meaningItem = {word: res.title, lang: code, langName: langName(code), tr:'', respell:'', ipa:'', meaning: first, source: res.noWiktionary ? (alt.length ? 'datamuse' : 'wikidata') : 'wiktionary', url: res.url || (res.wd && res.wd.url) || ''};
  const wdLine = res.wd ? `<p class="small" style="margin:8px 0 0"><span class="tag wd">Wikidata</span> <a href="${esc(res.wd.url)}" target="_blank" rel="noopener">${esc(res.wd.label)}</a>${res.wd.description ? ' — ' + esc(res.wd.description) : ''}</p>` : '';
  const altBlock = alt.length ? `<div class="alt"><div class="small muted" style="margin:6px 0 2px">${res.meanings.length ? 'Second source' : 'Definitions'} <span class="tag dm">Datamuse (WordNet)</span></div>
      <ul class="defs alt-defs">${alt.map(a => `<li>${a.pos ? `<i>${esc(a.pos)}</i> — ` : ''}${esc(a.def)}</li>`).join('')}</ul></div>` : '';
  const cmp = settings.compare.filter(c => c !== code && L[c]);
  r.innerHTML = `
    <h2 class="word-h"${langAttr(code)}>${esc(res.title)} <small>${esc(posList)}</small></h2>
    ${res.cached ? '<p class="small muted" style="margin:2px 0 0">Saved on this device</p>' : ''}
    <details class="pill" open><summary><span>Meaning</span><span class="meta">${ICON.chev}</span></summary><div class="body">
      <div style="display:flex;justify-content:flex-end"><button class="savebtn" data-save="meaning">☆ Save</button></div>
      ${res.meanings.length ? res.meanings.map(m => `<div class="pos">${esc(m.pos)}</div><ol class="defs">${m.defs.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`).join('')
        + `<p class="small muted" style="margin:4px 0 0"><span class="tag">Wiktionary</span> <a href="${esc(res.url)}" target="_blank" rel="noopener">Full entry ↗</a></p>`
        : (res.noWiktionary ? '<p class="muted small">No Wiktionary entry for this word.</p>' : '<p class="muted">No definitions found in the Wiktionary entry.</p>')}
      ${altBlock}${wdLine}
    </div></details>
    ${res.name ? `<details class="pill"${/^\p{Lu}/u.test(res.word) ? ' open' : ''}><summary><span>As a name — ${esc(res.name.title)}</span><span class="meta">${ICON.chev}</span></summary><div class="body">
      ${res.name.meanings.map(m => `<ol class="defs">${m.defs.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`).join('')}
      ${res.name.etymology.length ? `<div class="pos small">Name origin</div>${res.name.etymology.map(e=>`<p style="margin:0 0 8px">${esc(e)}</p>`).join('')}` : ''}
      <p class="small muted" style="margin:0"><span class="tag">Wiktionary</span> <a href="${esc(res.name.url)}" target="_blank" rel="noopener">Name entry ↗</a></p>
    </div></details>` : ''}
    <details class="pill"><summary><span>Word history</span><span class="meta">${ICON.chev}</span></summary><div class="body">
      ${res.etymology.length ? res.etymology.map(e=>`<p style="margin:0 0 8px">${esc(e)}</p>`).join('') + '<p class="small muted" style="margin:0"><span class="tag">Wiktionary</span></p>'
        : '<p class="muted">No etymology recorded for this word on Wiktionary.</p>'}
    </div></details>
    ${res.pivot ? `<div class="info">Translations are matched through the English word <b>${esc(res.pivot)}</b> (the first English gloss), so they may be approximate.</div>` : ''}
    ${!cmp.length ? '<p class="empty">Add compare languages above to see this word in other languages.</p>' : ''}
    <div class="cards">${cmp.map(c => langCard(res, c)).join('')}</div>
    <p class="credit">Sources: ${res.url ? `<a href="${esc(res.url)}" target="_blank" rel="noopener">Wiktionary “${esc(res.title)}”</a> (CC BY-SA 4.0)` : 'Wiktionary (no entry)'}${alt.length ? ' · <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener">Datamuse</a> (WordNet)' : ''}${res.wd ? ` · <a href="${esc(res.wd.url)}" target="_blank" rel="noopener">Wikidata</a> (CC0)` : ''}. Respellings marked <span class="tag auto">auto</span> are machine-generated from the transliteration.</p>`;
  r.querySelector('[data-save="meaning"]').onclick = () => saveSheet(meaningItem, () => renderResults(res));
  r.querySelectorAll('[data-save-c]').forEach(b => b.onclick = () => {
    const t = cardTerms(res, b.dataset.saveC)[+b.dataset.i];
    const c = b.dataset.saveC;
    const item = {word: t.term, lang: c, langName: langName(c), tr: t.tr || '', respell: respell(t.tr, c), ipa: (c==='hbo' ? t.tiberian : t.ipa) || '',
      meaning: (t.gloss ? t.gloss + ' — ' : '') + res.title, en: res.title, source: t.src || 'wiktionary', url: t.src==='wikidata' && res.wd ? res.wd.url : WIKT(t.page)};
    saveSheet(item, () => renderResults(res));
  });
  // Fill in missing transliteration / IPA from each language's own entry
  cmp.forEach(c => enrichCard(res, c));
}
function cardTerms(res, c){
  let terms = res.translations[c] || [];
  if (c === 'hbo' && !terms.length) terms = (res.translations.he || []).map(t => Object.assign({}, t, {viaHe:true}));
  // prefer one term per sense, then extras; cap at 4
  const seen = new Set(), out = [];
  for (const t of terms){ if (!seen.has(t.term)){ seen.add(t.term); out.push(t); } }
  return out.slice(0,4);
}
function termHTML(res, c, t, i){
  const lang = L[c];
  const tr = t.tr || t._tr || '';
  const rs = respell(tr, c);
  const ipa = c === 'hbo' ? (t._tiberian || '') : (t._ipa || '');
  const needsTr = !lang.latin;
  const sayParts = [];
  if (tr) sayParts.push(`${esc(tr)}${t._trFromEntry ? '' : ''}`);
  if (rs) sayParts.push(`<b>${esc(rs)}</b> <span class="tag auto" title="Machine-generated easy-read respelling">auto</span>`);
  return `<div class="term"><div class="main">
      <span class="script"${langAttr(c)}>${esc(t.term)}</span>
      <div class="say">${sayParts.join(' · ') || (needsTr ? '<span class="muted small">No transliteration in source</span>' : '')}</div>
      ${ipa ? `<div class="small muted">${c==='hbo'?'Biblical Hebrew IPA':'IPA'}: ${esc(ipa)}</div>` : (i===0 && t._done && lang.latin && c!=='en' ? '<div class="small muted">No pronunciation listed in source</div>' : '')}
      <div class="gloss">${[t.gloss && 'sense: ' + t.gloss, t.gender, t.qual, t.variety && (VARIETY[t.variety]||t.variety)].filter(Boolean).map(esc).join(' · ')}</div>
    </div><button class="savebtn" data-save-c="${c}" data-i="${i}" aria-label="Save ${esc(t.term)}">☆ Save</button></div>`;
}
function langCard(res, c, open){
  const terms = cardTerms(res, c);
  const name = langName(c);
  const head = terms[0] ? `<span class="sumtxt">${esc(name)} — <span${langAttr(c)}>${esc(terms[0].term)}</span></span>` : `<span class="sumtxt">${esc(name)}</span>`;
  let body;
  if (!terms.length) body = `<p class="muted">Neither Wiktionary nor Wikidata lists a ${esc(name)} form of “${esc(res.title)}”. Nothing has been guessed.</p>`;
  else body = (c==='hbo' && terms[0].viaHe ? `<div class="info small">Wiktionary doesn’t list Biblical Hebrew separately. Showing the Hebrew word(s), with the Biblical Hebrew pronunciation where the word’s entry gives one.</div>` : '')
    + terms.map((t,i) => termHTML(res, c, t, i)).join('')
    + (terms[0].src === 'wikidata' ? `<p class="small muted" style="margin:6px 0 0"><span class="tag wd">Wikidata</span> label — Wiktionary has no translation for this</p>`
       : `<p class="small muted" style="margin:6px 0 0"><span class="tag">Wiktionary</span> translation table</p>`);
  if (open === undefined){ const cmp = settings.compare.filter(x => x !== res.lang && L[x]); open = cmp.indexOf(c) < 4; }
  return `<details class="pill"${open ? ' open' : ''} data-card="${c}"><summary>${head}<span class="meta">${terms.length>1?terms.length:''} ${ICON.chev}</span></summary><div class="body">${body}</div></details>`;
}
async function enrichCard(res, c){
  const terms = cardTerms(res, c); if (!terms.length) return;
  const lang = L[c];
  const targets = terms.slice(0, 2).filter(t => !t._done && ((!lang.latin && !t.tr) || lang.latin || c==='hbo' || !t._ipa));
  if (!targets.length) return;
  await Promise.all(targets.map(async t => {
    const e = await enrichTerm(c, t);
    if (!t.tr && e.tr){ t._tr = e.tr; t._trFromEntry = true; }
    t._ipa = e.ipa; t._tiberian = e.tiberian; t._done = true;
  }));
  if (current !== res) return;
  const card = document.querySelector(`[data-card="${c}"]`);
  if (!card) return;
  const open = card.open;
  card.outerHTML = langCard(res, c, open);
  const nc = document.querySelector(`[data-card="${c}"]`); nc.open = open;
  nc.querySelectorAll('[data-save-c]').forEach(b => b.onclick = () => {
    const t = cardTerms(res, c)[+b.dataset.i];
    const tr = t.tr || t._tr || '';
    saveSheet({word:t.term, lang:c, langName:langName(c), tr, respell:respell(tr,c), ipa:(c==='hbo'?t._tiberian:t._ipa)||'', meaning:(t.gloss?t.gloss+' — ':'')+res.title, en:res.title, source:t.src||'wiktionary', url: t.src==='wikidata' && res.wd ? res.wd.url : WIKT(t.page)});
  });
}

/* ---------- Lists view ---------- */
function renderLists(){
  const v = $('#view');
  v.innerHTML = `<h2 class="page">My lists</h2>
    <div class="btns"><button class="btn primary" id="nlBtn">+ New list</button><button class="btn" id="exBtn">Export</button><button class="btn" id="imBtn">Import</button></div>
    ${lists.length ? lists.map(l => `<a class="pill" href="#list/${l.id}"><div class="row"><span class="sumtxt">${esc(l.name)}</span>
      <span class="meta muted small" style="font-weight:400;display:flex;gap:6px;align-items:center;flex:none"><span class="tag ${l.type==='compare'?'cmp':'plain'}">${l.type==='compare'?'Bridging':'Simple'}</span> ${l.items.length} ›</span></div></a>`).join('')
      : '<p class="empty">No lists yet. Create one, or tap ☆ Save on any search result.</p>'}
    <p class="credit">Lists are stored on this device. Use Export / Import to move them between your phone and PC.</p>`;
  $('#nlBtn').onclick = () => newListSheet(l => { location.hash = 'list/' + l.id; });
  $('#exBtn').onclick = exportData;
  $('#imBtn').onclick = () => $('#importFile').click();
}
function itemHTML(it, opts={}){
  const d = displayWord(it);
  const say = [isNonLatin(it.word) && !d.missing ? `<span class="orig"${langAttr(it.lang)}>${esc(it.word)}</span>` : '', it.tr && esc(it.tr), it.respell && `<b>${esc(it.respell)}</b>`, d.auto ? `${esc(it.autoTr)} <span class="tag auto">auto</span>` : ''].filter(Boolean).join(' · ');
  return `<div class="item"><div class="main">
    ${dwHTML(it)}${d.missing ? ' <span class="small muted">(no transliteration found)</span>' : ''}
    <div class="small">${say ? say + ' · ' : ''}${esc(L[it.lang] ? langName(it.lang) : (it.langName || it.lang))}${it.source==='typed' ? ' <span class="tag plain">typed</span>' : ''}</div>
    ${it.ipa ? `<div class="small muted">IPA: ${esc(it.ipa)}</div>` : ''}
    <div class="small muted">${it.meaning ? esc(it.meaning) + ' · ' : ''}saved ${esc(fmtDate(it.saved))}${it.url ? ` · <a href="${esc(it.url)}" target="_blank" rel="noopener">source</a>` : ''}</div>
  </div>${opts.remove ? `<button class="rm" data-rm="${it.id}" aria-label="Remove ${esc(it.word)}">Remove</button>` : ''}</div>`;
}
function renderList(id){
  const l = getList(id); const v = $('#view');
  if (!l){ v.innerHTML = `<p class="empty">This list no longer exists.</p><div class="btns"><a class="btn" href="#lists">Back to lists</a></div>`; return; }
  const head = `<p style="margin:10px 0 0"><a href="#lists" class="small">‹ All lists</a></p>
    <h2 class="page">${esc(l.name)} <span class="tag ${l.type==='compare'?'cmp':'plain'}">${l.type==='compare'?'Bridging':'Simple'}</span></h2>
    <p class="small muted" style="margin:0">${l.items.length} item${l.items.length===1?'':'s'}</p>
    <div class="btns"><button class="btn" id="rnBtn">Rename</button><button class="btn danger" id="dlBtn">Delete list</button></div>`;
  if (l.type === 'compare') v.innerHTML = head + compareHTML(l);
  else v.innerHTML = head + `<div class="pill static">${l.items.length ? [...l.items].reverse().map(it => itemHTML(it, {remove:true})).join('') : '<p class="empty">Nothing saved yet. Search for a word and tap ☆ Save.</p>'}</div>`;
  $('#rnBtn').onclick = () => promptSheet('Rename list', l.name, 'Rename', n => { l.name = n; saveLists(); render(); });
  $('#dlBtn').onclick = () => confirmSheet('Delete list?', `“${l.name}” and its ${l.items.length} item(s) will be removed from this device.`, 'Delete', () => { lists = lists.filter(x => x !== l); saveLists(); location.hash = 'lists'; });
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const it = l.items.find(i=>i.id===b.dataset.rm); removeItem(l, b.dataset.rm); saveLists(); render(); toast(`Removed “${it ? dwText(it) : ''}”`); });
  if (l.type === 'compare') wireCompare(l);
  fillTranslits(l);
}
// For non-Latin words saved without a transliteration: look it up on the word's Wiktionary entry,
// otherwise fall back to a simple machine transliteration (Greek / Cyrillic only)
let translitBusy = false;
async function fillTranslits(l){
  if (translitBusy) return;
  const todo = l.items.filter(it => isNonLatin(it.word) && !it.tr && !it.trTried);
  if (!todo.length) return;
  translitBusy = true;
  let changed = false;
  for (const it of todo){
    if (navigator.onLine !== false && L[it.lang]){
      let e; try{ e = await enrichTerm(it.lang, {page: titleForm(it.word, it.lang)}); }catch(err){ e = {err:true}; }
      if (e.err){ if (!it.autoTr){ const a = autoTranslit(it.word); if (a){ it.autoTr = a; changed = true; } } continue; }   // network problem: try the dictionary again next time
      try{ if (e.tr){ it.tr = e.tr; it.respell = it.respell || respell(e.tr, it.lang); } if (!it.ipa && e.ipa) it.ipa = it.lang==='hbo' ? (e.tiberian||'') : e.ipa; }
      catch(err){ continue; }
    }
    if (!it.tr){ const a = autoTranslit(it.word); if (a) it.autoTr = a; }
    it.trTried = true; changed = true;
  }
  translitBusy = false;
  if (changed){ saveLists(); const r = route(); if (r.name === 'list' && r.id === l.id) render(); }
}

/* ---------- Compare list (boxes) ---------- */
function ensureBoxes(l){
  if (!l.boxes) l.boxes = {n:2, slots:[null,null,null,null], active:0};
  if (!Array.isArray(l.boxes.slots)) l.boxes.slots = [null,null,null,null];
  while (l.boxes.slots.length < 4) l.boxes.slots.push(null);
  if (!l.combos) l.combos = [];
  const b = l.boxes;
  if (b.active == null || b.active >= b.n || b.slots[b.active]) b.active = b.slots.slice(0,b.n).findIndex(s => !s);
}
function compareHTML(l){
  ensureBoxes(l);
  const b = l.boxes; const item = id => l.items.find(i => i.id === id);
  const view = b.view === 'details' ? 'details' : 'simple';
  const boxes = [];
  const words = [];
  for (let k=0;k<b.n;k++){
    const it = b.slots[k] && item(b.slots[k]);
    words.push(it ? `<bdi${displayWord(it).missing ? langAttr(it.lang) : ''}>${esc(dwText(it))}</bdi>` : `<bdi class="gap">___</bdi>`);
    const rmBtn = it ? `<button class="boxrm" data-boxrm="${k}" aria-label="Remove ${esc(dwText(it))} from box ${k+1}">✕${view==='details' ? ' remove' : ''}</button>` : '';
    const lockIc = `<span class="lockic" title="Locked">${ICON.lock}</span>`;
    if (it && view === 'simple'){
      boxes.push(`<div class="box lock" aria-label="Word ${k+1}: ${esc(dwText(it))}"><div class="bh"><span>${k+1} ${lockIc}</span> ${rmBtn}</div>${dwHTML(it)}</div>`);
    } else if (it){
      const say = [it.tr, it.respell].filter(Boolean);
      boxes.push(`<div class="box lock" aria-label="Word ${k+1}: ${esc(dwText(it))}"><div class="bh"><span>Word ${k+1} ${lockIc}</span> ${rmBtn}</div>
        ${dwHTML(it)}
        ${isNonLatin(it.word) && !displayWord(it).missing ? `<span class="orig"${langAttr(it.lang)}>${esc(it.word)}</span>` : ''}
        ${say.length ? `<div>${esc(say[0])}${say[1] ? ' · <b>'+esc(say[1])+'</b>' : ''}</div>` : ''}
        <div class="muted small">${esc(L[it.lang] ? langName(it.lang) : (it.langName || it.lang))}${it.meaning ? ' · ' + esc(it.meaning) : ''}${it.source==='typed' ? ' · typed' : ''}</div></div>`);
    } else if (k === b.active){
      boxes.push(`<div class="box act"><div class="bh">${view==='details'?'Word ':''}${k+1} <span style="color:var(--teal)">active</span></div><div class="muted small">${view==='details'?'Tap a word below, or type one':'next'}</div></div>`);
    } else {
      boxes.push(`<button class="box" data-activate="${k}" aria-label="Make box ${k+1} the active box"><div class="bh">${view==='details'?'Word ':''}${k+1}</div><div class="muted small">empty</div></button>`);
    }
  }
  const used = new Set(b.slots.slice(0,b.n).filter(Boolean));
  const filled = b.slots.slice(0,b.n).filter(s => s && item(s)).length;
  const typeIn = b.active >= 0 ? `<div class="typein"><label class="small" for="typeW">Type a word for box ${b.active+1} (saved exactly as typed)</label>
      <div class="row"><input id="typeW" placeholder="Type a word…" autocomplete="off">
      <select id="typeL" aria-label="Language of typed word">${LANGS.map(x=>`<option value="${x.code}" ${x.code===(l.lastLang||settings.defaultLang)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <button class="btn primary" id="typeGo">Lock in</button></div></div>` : '';
  return `
    <div class="seg" role="group" aria-label="Number of boxes">${[2,3,4].map(n=>`<button data-n="${n}" aria-pressed="${b.n===n}">${n} boxes</button>`).join('')}</div>
    <div class="seg two" role="group" aria-label="Box display">${['simple','details'].map(m=>`<button data-view="${m}" aria-pressed="${view===m}">${m==='simple'?'Simple':'Details'}</button>`).join('')}</div>
    <p class="sentence" aria-label="Words in order">${words.join(' ')}</p>
    <div class="boxes ${view} n${b.n}">${boxes.join('')}</div>
    ${typeIn}
    <div class="btns"><button class="btn" id="clrBtn" ${filled?'':'disabled'}>Clear boxes</button><button class="btn primary" id="cmbBtn" ${filled>=2?'':'disabled'}>Save combination</button></div>
    <p class="lbl">Words in this list — tap to lock into the next box</p>
    ${l.items.length ? `<div class="chips">${l.items.map(it => `<button class="chip" data-pick="${it.id}" ${used.has(it.id)?'disabled':''}${displayWord(it).missing ? langAttr(it.lang) : ''}>${esc(dwText(it))}</button>`).join('')}</div>`
      : '<p class="empty">No words yet — save words from Search into this list, or type one above.</p>'}
    <details class="pill"><summary><span>Saved combinations</span><span class="meta">${l.combos.length} ${ICON.chev}</span></summary><div class="body">
      ${l.combos.length ? l.combos.map(cb => `<div class="item"><div class="main"><b>${esc(cb.name)}</b><div class="small muted">${cb.slots.slice(0,cb.n).map(id => { const it = item(id); return it ? esc(dwText(it)) : '—'; }).join(' ')} · ${esc(fmtDate(cb.saved))}</div></div>
        <button class="rm" data-open="${cb.id}">Open</button><button class="rm" data-delc="${cb.id}" aria-label="Delete combination ${esc(cb.name)}">Delete</button></div>`).join('') : '<p class="muted small">Lock 2 or more words into boxes, then tap Save combination.</p>'}
    </div></details>
    <details class="pill"><summary><span>Manage words</span><span class="meta">${l.items.length} ${ICON.chev}</span></summary><div class="body">
      ${l.items.length ? [...l.items].reverse().map(it => itemHTML(it, {remove:true})).join('') : '<p class="muted small">No words yet.</p>'}
    </div></details>`;
}
function wireCompare(l){
  const v = $('#view'); const b = l.boxes;
  const fill = (itemId) => {
    let k = b.active;
    if (k == null || k < 0 || b.slots[k]) k = b.slots.slice(0,b.n).findIndex(s => !s);
    if (k < 0) return toast('All boxes are locked — unlock one first');
    b.slots[k] = itemId; b.active = b.slots.slice(0,b.n).findIndex(s => !s);
    saveLists(); render();
  };
  v.querySelectorAll('[data-n]').forEach(x => x.onclick = () => { b.n = +x.dataset.n; b.active = null; saveLists(); render(); });
  v.querySelectorAll('[data-view]').forEach(x => x.onclick = () => { b.view = x.dataset.view; saveLists(); render(); });
  v.querySelectorAll('[data-boxrm]').forEach(x => x.onclick = () => { const k = +x.dataset.boxrm; const it = l.items.find(i=>i.id===b.slots[k]); b.slots[k] = null; b.active = k; saveLists(); render(); toast(`Removed “${it ? dwText(it) : ''}” from box ${k+1}`); });
  v.querySelectorAll('[data-activate]').forEach(x => x.onclick = () => { b.active = +x.dataset.activate; saveLists(); render(); setTimeout(()=>$('#typeW') && $('#typeW').focus(), 0); });
  v.querySelectorAll('[data-pick]').forEach(x => x.onclick = () => fill(x.dataset.pick));
  const go = $('#typeGo');
  if (go){
    const lock = () => {
      const w = $('#typeW').value.trim(); if (!w) return $('#typeW').focus();
      const lang = $('#typeL').value; l.lastLang = lang;
      let it = l.items.find(i => i.word === w && i.lang === lang);
      if (!it){ it = {id:uid(), word:w, lang, langName:langName(lang), tr:'', respell:'', ipa:'', meaning:'', source:'typed', saved:new Date().toISOString()}; l.items.push(it); }
      fill(it.id);
    };
    go.onclick = lock;
    $('#typeW').addEventListener('keydown', e => { if (e.key === 'Enter') lock(); });
  }
  $('#clrBtn').onclick = () => { b.slots = [null,null,null,null]; b.active = 0; saveLists(); render(); };
  $('#cmbBtn').onclick = () => {
    const words = b.slots.slice(0,b.n).map(id => l.items.find(i=>i.id===id)).filter(Boolean).map(dwText);
    promptSheet('Name this combination', words.join(' '), 'Save', name => { l.combos.push({id:uid(), name, n:b.n, slots:b.slots.slice(), saved:new Date().toISOString()}); saveLists(); render(); toast('Combination saved'); });
  };
  v.querySelectorAll('[data-open]').forEach(x => x.onclick = () => { const cb = l.combos.find(c=>c.id===x.dataset.open); b.n = cb.n; b.slots = cb.slots.map(id => l.items.some(i=>i.id===id) ? id : null); while (b.slots.length<4) b.slots.push(null); b.active = null; saveLists(); render(); window.scrollTo(0,0); });
  v.querySelectorAll('[data-delc]').forEach(x => x.onclick = () => { const cb = l.combos.find(c=>c.id===x.dataset.delc); confirmSheet('Delete combination?', `“${cb.name}” will be removed. The words stay in the list.`, 'Delete', () => { l.combos = l.combos.filter(c => c !== cb); saveLists(); render(); }); });
}

/* ---------- Export / Import ---------- */
function exportData(){
  const data = {app:'bridging-terms', format:1, exported:new Date().toISOString(), lists};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'bridging-terms-lists-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Exported ' + lists.length + ' list(s)');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data;
  try{ data = JSON.parse(await f.text()); }catch(err){ return toast('That file isn’t valid JSON'); }
  const inc = Array.isArray(data) ? data : data && data.lists;
  if (!Array.isArray(inc)) return toast('No lists found in that file');
  openSheet(`<h2 id="sheetTitle">Import ${inc.length} list(s)</h2>
    <p class="muted small">Merge adds new lists and new words to lists you already have. Replace swaps all lists on this device for the file’s lists.</p>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn" data-r>Replace all</button><button class="btn primary" data-m>Merge</button></div>`, sh => {
    sh.querySelector('[data-x]').onclick = closeSheet;
    sh.querySelector('[data-r]').onclick = () => { lists = inc.map(normList).filter(Boolean); saveLists(); closeSheet(); render(); toast('Lists replaced'); };
    sh.querySelector('[data-m]').onclick = () => {
      let nl = 0, ni = 0;
      for (const raw of inc){
        const x = normList(raw); if (!x) continue;
        const mine = getList(x.id) || lists.find(l => l.name === x.name && l.type === x.type);
        if (!mine){ lists.push(x); nl++; continue; }
        for (const it of x.items){ if (!mine.items.some(i => i.id === it.id || sameItem(i,it))){ mine.items.push(it); ni++; } }
        for (const c of x.combos){ if (!mine.combos.some(m => m.id === c.id)) mine.combos.push(c); }
      }
      saveLists(); closeSheet(); render(); toast(`Merged: ${nl} new list(s), ${ni} new word(s)`);
    };
  });
});
function normList(x){
  if (!x || typeof x !== 'object' || !Array.isArray(x.items)) return null;
  const l = {id: String(x.id || uid()), name: String(x.name || 'Imported list'), type: x.type === 'compare' ? 'compare' : 'simple', created: x.created || new Date().toISOString(),
    items: x.items.filter(i => i && i.word).map(i => ({id:String(i.id||uid()), word:String(i.word), lang:String(i.lang||'en'), langName:String(i.langName||langName(i.lang)), tr:String(i.tr||''), respell:String(i.respell||''), ipa:String(i.ipa||''), meaning:String(i.meaning||''), en:i.en?String(i.en):undefined, autoTr:i.autoTr?String(i.autoTr):undefined, trTried:!!i.trTried, source:i.source==='typed'?'typed':'wiktionary', url: /^https:\/\//.test(i.url||'') ? i.url : '', saved:i.saved||new Date().toISOString()})),
    combos: Array.isArray(x.combos) ? x.combos.filter(c => c && Array.isArray(c.slots)).map(c => ({id:String(c.id||uid()), name:String(c.name||'Combination'), n:[2,3,4].includes(c.n)?c.n:2, slots:c.slots.slice(0,4).map(s=>s?String(s):null), saved:c.saved||new Date().toISOString()})) : []};
  if (l.type === 'compare') l.boxes = x.boxes && Array.isArray(x.boxes.slots) ? {n:[2,3,4].includes(x.boxes.n)?x.boxes.n:2, slots:x.boxes.slots.slice(0,4), active:null, view:x.boxes.view==='details'?'details':'simple'} : {n:2, slots:[null,null,null,null], active:0};
  return l;
}

/* ---------- Settings view ---------- */
function renderSettings(){
  const v = $('#view');
  const cacheN = Object.keys(store.get(CACHE_KEY, {})).length;
  v.innerHTML = `<h2 class="page">Settings</h2>
    <div class="settings-sec">
      <h3>Appearance</h3>
      <div class="seg four" role="group" aria-label="Theme">${THEMES.map(t=>`<button data-theme-set="${t}" aria-pressed="${settings.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
      <h3>Languages</h3>
      <div class="btns"><button class="btn choice" id="sDef">Default language<small>${esc(langName(settings.defaultLang))}</small></button>
        <button class="btn choice" id="sCmp">Compare languages<small>${esc(settings.compare.map(langName).join(', ') || 'none')}</small></button></div>
      <h3>Your data</h3>
      <div class="btns"><button class="btn" id="sEx">Export lists</button><button class="btn" id="sIm">Import lists</button><button class="btn" id="sClr">Clear search history</button></div>
      <p class="small muted">${cacheN} looked-up word(s) are kept on this device so they reopen instantly. Lists and settings are stored only in this browser — export regularly as a backup.</p>
      <h3>About the data</h3>
      <p class="small">Meanings, word history and translations come from <a href="https://en.wiktionary.org/" target="_blank" rel="noopener">English Wiktionary</a>, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Transliterations are from Wiktionary’s translation tables or the word’s own entry. The bold easy-read respelling (e.g. <b>sha-LOHM</b>) is machine-generated from that transliteration and marked <span class="tag auto">auto</span>. Where the source has no transliteration or pronunciation, the app says so instead of guessing. Second sources: <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a> (CC0) gives names, people, places and concepts in many languages and fills in when Wiktionary has no translation (marked <span class="tag wd">Wikidata</span>); <a href="https://www.datamuse.com/api/" target="_blank" rel="noopener">Datamuse</a> adds extra English definitions from WordNet (marked <span class="tag dm">Datamuse</span>).</p>
      <p class="small muted">Biblical Hebrew isn’t listed separately on Wiktionary, so that card shows the Hebrew word with its Biblical Hebrew (Tiberian) pronunciation when the entry has one. Koine Greek is listed under Ancient Greek.</p>
      <p class="credit">Bridging Terms v${APP_VERSION}</p>
    </div>`;
  v.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { settings.theme = b.dataset.themeSet; saveSettings(); applyTheme(); render(); });
  $('#sDef').onclick = pickDefaultLang; $('#sCmp').onclick = pickCompareLangs;
  $('#sEx').onclick = exportData; $('#sIm').onclick = () => $('#importFile').click();
  $('#sClr').onclick = () => confirmSheet('Clear search history?', 'Recent searches and saved look-ups are removed from this device. Your lists are not affected.', 'Clear', () => { recent = []; store.set('recent', []); store.set(CACHE_KEY, {}); store.set(TERMS_KEY, {}); current = null; render(); toast('Search history cleared'); });
}

/* ---------- Start ---------- */
applyTheme();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
